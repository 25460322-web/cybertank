# Práctica 3.3 · Clúster EKS creado a mano con eksctl
#   eksctl create cluster -f aws/cluster.yaml
# Revisa en agones.dev → "Kubernetes version support" que tu versión de Agones soporte esta versión.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: cybertank
  region: us-east-2
  version: "1.33"
iam:
  withOIDC: false   # la SCP de la escuela bloquea iam:*OpenIDConnectProvider; el autoscaler usa el rol del nodo
addons:                       # red básica del clúster (sin OIDC usan los permisos del rol del nodo)
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
availabilityZones: ["us-east-2a", "us-east-2b"]
vpc:
  nat:
    gateway: Disable          # los nodos van en subredes públicas: sin NAT (ahorra ~USD 33/mes)
managedNodeGroups:
  - name: juego
    instanceType: c7i-flex.large  # 2 vCPU · única c7i permitida en el plan gratuito de la cuenta
    minSize: 3
    maxSize: 12
    desiredCapacity: 3
    privateNetworking: false  # IP pública: los jugadores se conectan directo al nodo
    labels: { rol: juego }
    iam:
      withAddonPolicies:
        autoScaler: true      # permiso para el Cluster Autoscaler
